[workspace]
resolver = "3"
members = [
    "crates/helix-core",
    "crates/helix-gui",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.84"
license = "MIT OR Apache-2.0"
authors = ["HelixPrime Contributors"]
description = "Open-source modern alignment inspection and UniProt/AlphaFold 3D protein visualization suite inspired by Geneious Prime."

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ureq = { version = "2.10", default-features = false, features = ["native-tls", "gzip", "json"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
